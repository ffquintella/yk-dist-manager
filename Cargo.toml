[package]
name = "yk-dist-manager"
version = "0.12.0"
edition = "2024"
description = "YubiKey distribution and bootstrap manager (egui desktop app)"
license = "MIT"

[lib]
name = "yk_dist_manager"
path = "src/lib.rs"

[[bin]]
name = "yk-dist-manager"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"

# The secrets a bootstrap sets (`crate::secret`). Both are load-bearing for
# AGENTS.md §2 rather than conveniences:
#
# * `zeroize` wipes the buffer on drop, so a PIN does not linger in freed memory
#   for the rest of the process's life. Doing this by hand is exactly the kind of
#   code a compiler is entitled to optimise away.
# * `getrandom` is the OS CSPRNG. `features/secrets-custody.md` is explicit that a
#   seeded PRNG is not acceptable here: these values protect a signing key.
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"

# Verifying the signature on a bootstrap template
# (`features/bootstrap-templates.md` phase 5). A template decides what is written
# to security hardware, so an unauthorised edit of one is an attack — and the only
# signature scheme this tool can carry is a *public-key* one, because AGENTS.md §2
# forbids it holding a secret anywhere that can persist. So the private key lives
# wherever the organisation keeps it and never comes near this application: the
# tool verifies, and signing is an out-of-band step over the documented canonical
# bytes.
#
# Not behind a feature flag: a build that could not verify a signature would treat
# every template as unsigned, which is the state the flag would have been meant to
# protect against. `default-features = false` drops the `fast` backend (a
# performance choice, for one verification per run) and `rand_core` (only signing
# needs it, and this crate does not sign).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# The workstation name written into the single-writer lock file that guards a
# database hosted in a cloud-sync folder (`store::cloud`). One syscall wrapper,
# already in the dependency graph, and the alternative was a hand-rolled
# environment-variable guess that is wrong on macOS.
gethostname = "1"

# Single-file database. `bundled` compiles SQLite in, so a workstation needs no
# system SQLite and the file is the whole deployment.
rusqlite = { version = "0.40", features = ["bundled"] }

# Native, pure-Rust access to the hardware. Preferred over shelling out to
# `ykman`; see docs/yubikey-reference.md for what each crate can and cannot do.
#
# `pcsc`/`hidapi` link against system libraries (PCSC.framework on macOS,
# libpcsclite/hidraw on Linux, WinSCard on Windows), so the transports live
# behind a feature flag while the roadmap's Wave 1 lands them.
yubikey = { version = "0.8", optional = true }
# X.509 and PKCS#10: the SubjectPublicKeyInfo a generated key is reported as, the
# CSR this tool assembles, and the certificate the operator brings back from the
# CA. Pinned to the version `yubikey` already resolves, so this adds a name to the
# build rather than a package.
# Must match the version `yubikey` resolves (0.2.x), or `piv::generate` returns
# a `SubjectPublicKeyInfo` from a *different* crate version and the types do not
# unify — which is exactly what happened when this was first pinned to 0.3.
#
# Not optional, unlike the transports: `device::certificate` reads and checks a
# certificate with no card involved, and a build without PIV writes still has to
# be able to say what an operator just pasted in. Pure Rust, so it costs a
# compile and no system library.
x509-cert = "0.2.5"
# The PIV management key, which the `yubikey` crate cannot set on firmware 5.7+:
# its MgmKey is a 24-byte 3DES type, and 5.7 removed 3DES and defaults the slot
# to AES-192. `mod transaction` is private there, so the GENERAL AUTHENTICATE
# exchange is done on our own PC/SC connection instead — see
# `device::piv_mgm`. Both crates are already in the graph via `yubikey`.
pcsc = { version = "2.9", optional = true }
aes = { version = "0.9", optional = true }
ctap-hid-fido2 = { version = "3.5", optional = true }
hidapi = { version = "2.6", optional = true }

# Native open/save dialogs for choosing or creating the database file. On Linux
# this goes through the XDG portal rather than linking GTK.
rfd = { version = "0.17", optional = true }

# Reading a serial from a barcode: `rxing` decodes, `image` loads a photo from
# disk, `nokhwa` captures from a camera.
rxing = { version = "0.9", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "jpeg",
    "png",
] }
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }
egui-elegance = "0.15"

# Connecting an SMB share so the database can live on one (`store::smb`). Both are
# native OS APIs rather than `net use` / `mount_smbfs`, for one reason: they take the
# password in this process's memory, while a command line puts it in an argument
# vector every other process can read.
[target.'cfg(windows)'.dependencies]
# `WNetAddConnection2W` / `WNetCancelConnection2W`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# `NetFSMountURLSync` needs CoreFoundation strings, URLs and arrays. Both crates
# are already in the dependency graph through the window layer.
core-foundation = "0.10"
core-foundation-sys = "0.8"

[features]
# Native hardware access is the **default** as of 0.12.0. It was opt-in while the
# transports were being written; keeping it opt-in after they worked meant the
# shipped build shelled out to a Python subprocess for every read while the
# in-process transport sat compiled-out. `device::select` demotes to `ykman` at
# runtime when no reader answers, so the flag was protecting against a case the
# probe already handles — at the cost of making the good path the one nobody got.
#
# What this costs: a default build now links PC/SC and USB HID, so Linux needs
# `libpcsclite-dev` and `libudev-dev` at build time (already true for `eframe`'s
# X11/GTK headers) and `pcscd` at run time. The `ykman`-only build is still
# supported and still tested in CI:
#
#     cargo build --no-default-features --features file-dialog,camera
default = ["file-dialog", "camera", "native-device"]
# Choose or create the database file through a native dialog. Without it the
# path is still typeable, so the feature is convenience, not capability.
file-dialog = ["dep:rfd"]
# Decode a serial from a barcode in an image (a photo of the box label).
barcode = ["dep:rxing", "dep:image"]
# Live camera capture feeding the decoder. On by default, which brings two
# obligations with it (see features/serial-scanning.md):
#   * a macOS bundle MUST carry NSCameraUsageDescription, or the app is killed
#     the first time it opens the camera;
#   * `nokhwa`'s macOS bindings pull `block` 0.1.6, which cargo reports as
#     future-incompatible — that now blocks a *released* build, not an opt-in one.
# `--no-default-features --features file-dialog` gives the previous build.
camera = ["barcode", "dep:nokhwa"]
# Optional password protection of the database file, via SQLCipher
# (`PRAGMA key`). Off by default because it vendors and builds OpenSSL.
encrypted-db = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# PIV over PC/SC with the `yubikey` crate.
#
# NOTE: this enables `yubikey/untested`, which is upstream's own name for the
# feature gating every mutating PIV call (change_pin, change_puk, and the three
# MgmKey setters). Their read paths are not gated; it is precisely the writes
# whose failure mode is worst that upstream declines to vouch for, and a
# management key set to a value nobody holds leaves the applet administratively
# dead. Turned on deliberately, with the reasoning and the alternatives recorded
# in `features/step-piv-pin-puk-management-key.md`, and every operation
# exercised against a dedicated test key before it is relied on.
native-piv = ["dep:yubikey", "dep:pcsc", "dep:aes", "yubikey/untested"]
# FIDO2 / CTAP2 over USB HID.
native-fido = ["dep:ctap-hid-fido2"]
# Yubico OTP slot configuration over USB HID.
native-otp = ["dep:hidapi"]
# Everything native.
native-device = ["native-piv", "native-fido", "native-otp"]

[dev-dependencies]
tempfile = "3"

# Property tests for the two pieces of pure logic whose failure modes are shaped
# like inputs nobody thinks to write down: the audit chain and the RFC 4514
# escaper (`features/testing-strategy.md` phase 9). A dev-dependency, so it is in
# no shipped binary.
proptest = { version = "1", default-features = false, features = ["std"] }
