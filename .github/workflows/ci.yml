# Continuous integration — features/testing-strategy.md phase 5 and phase 10.
#
# What this proves, and what it deliberately does not:
#
# * `check` runs the whole pre-commit sweep from AGENTS.md §4 on Linux, plus the
#   coverage gate with its 80% floor. This is the job that can fail a merge.
# * `cross-platform` compiles on macOS, Windows and Linux, including the native
#   hardware features. It does **not** run the hardware tests: a hosted runner
#   has no PC/SC reader and no USB HID device, so those stay `#[ignore]`d and
#   what the matrix proves is that the platform-specific transports still build.
#   `features/testing-strategy.md` records that limitation rather than pretending
#   the matrix is more than it is. Its Windows leg also *links* the MSI authoring,
#   which is the one thing in this repository that used to be proven only by a
#   release build — see the step for what that cost.
#
# No job ever touches a real key, in line with the hardware policy: "no test
# writes to a YubiKey. Ever. Not even an ignored one."
#
# Nothing here interpolates event data (an issue title, a branch name, a commit
# message) into a shell command: the only expressions used are `matrix.os` and
# `runner.os`, both of which come from this file rather than from a contributor.
#
# Actions are pinned to a major version, and `checkout` is on v7 because v4 runs
# on Node 20, which the hosted runners no longer provide. The breaking change v7
# carries — a fork's head is no longer checked out for `pull_request_target` and
# `workflow_run` — cannot reach this file: it triggers on `pull_request`, and the
# token it gets is `contents: read`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning in CI is a failure; the working agreement asks for a
  # warning-free clippy.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      # eframe needs X11/Wayland and GTK-adjacent development headers to link,
      # even for a build that never opens a window.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libudev-dev libpcsclite-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The no-camera build is a supported configuration, so it has to keep
      # compiling (`make check-all`).
      - name: The build without default features
        run: cargo check --no-default-features --features file-dialog

      - name: Tests
        run: cargo test --all-features

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # THE GATE. `make coverage-core` passes --fail-under-lines, so this step
      # fails the build when the headless core drops below the floor.
      - name: Coverage of the headless core (floor 80%)
        run: make coverage-core

  cross-platform:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libudev-dev libpcsclite-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo check --all-targets

      # PC/SC and USB HID are linked per platform, and they are the parts most
      # likely to break on a platform nobody develops on — which is why the step
      # above, a plain default build, now covers them: `native-device` is on by
      # default as of 0.12.0. What needs its own step is the *other* direction:
      # the `ykman`-only build is still supported, and nothing in a native-by-
      # default world would notice it stopped compiling.
      - name: The ykman-only build, without the native transports
        run: cargo check --no-default-features --features file-dialog,camera

      - name: Tests
        run: cargo test

      # Half the mistakes available in an installer are found by the *linker*,
      # after every source has been parsed — a shortcut naming an icon that was
      # never declared parses perfectly. Until now the only thing that linked this
      # authoring was a release build, which needs a tag, so those mistakes cost a
      # version number each: v0.16.0 and v0.16.1 both died there. -LinkOnly links
      # it against a placeholder instead of a compiled binary and throws the result
      # away, which takes seconds and needs nothing built. It does not check that
      # the installer *works* — verify-msi.ps1 does that, from a tag.
      - name: The Windows installer authoring links
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\windows\msi.ps1 -LinkOnly
