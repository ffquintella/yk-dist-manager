# Release from a tag — features/packaging-and-release.md phases 6 and 8.
#
# The norm's requirement is that every version installed anywhere is generated
# from version control and carries a tag. This workflow is how that is met rather
# than promised: it triggers on `v*`, builds each platform from a fresh checkout of
# the tag, verifies each artefact by asking the binary about itself, and attaches
# the results to a draft release whose notes are generated from the changelog.
#
# What it deliberately does **not** do:
#
#   * **Publish.** The release is a draft. Somebody looks at the artefacts and the
#     notes and presses the button — a release of a tool that holds a token
#     register is not a thing to have happen automatically at 03:00.
#   * **Sign for distribution.** Developer ID notarisation (macOS) and
#     Authenticode (Windows) need certificates this project does not have; those
#     are phases 3b and 4, and both are blocked on procurement rather than on code.
#     Every signing step is here, guarded by whether its secret exists, so the day
#     a certificate arrives the change is a secret rather than a rewrite. There are
#     **three** such secrets, because macOS signs an application and an installer
#     package with different certificates:
#       MACOS_SIGN_IDENTITY            Developer ID Application — the .app
#       MACOS_INSTALLER_SIGN_IDENTITY  Developer ID Installer   — the .pkg
#       WINDOWS_SIGN_CERT_THUMBPRINT   Authenticode             — the .exe and .msi
#     The Windows one names a certificate in the runner's own store, which a hosted
#     runner has no way to hold; that is a decision for the day the certificate
#     exists (a self-hosted runner, an import step, or Azure Trusted Signing),
#     and until then the guard skips the step and says so.
#   * **Run hardware tests.** A hosted runner has no reader and no USB key, which
#     is the same limitation ci.yml records.
#
# ## Untrusted input
#
# One value here comes from a person: `inputs.tag` on a manual run. It is bound to
# an environment variable at the job level and referenced as `"$TAG"` inside every
# `run:`, never interpolated into a shell command — a `${{ }}` expression is
# substituted into the script *before* the shell sees it, so a tag containing a
# shell metacharacter would otherwise be executed. The same rule applies to the
# signing identity, which is a secret rather than a value to splice into a command
# line. `github.ref_name` is a ref name and could be interpolated safely, but it is
# carried the same way so there is one pattern here rather than two.

name: Release

on:
  push:
    # `releases/v*` is what `make release` creates, and the namespace says the tag
    # is a build somebody was handed rather than any other kind of marker. `v*`
    # stays so the tags from before the namespace existed still build.
    tags: ["releases/v*", "v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build (must already exist)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The one artefact decision this repository has made
  # (features/packaging-and-release.md, "Feature flags in a release build"): one
  # build with everything an operator cannot add later. `encrypted-db` vendors
  # OpenSSL and makes the build slower; telling an operator they have the wrong
  # build is worse.
  YKDM_FEATURES: native-device,encrypted-db
  # The verifiers fail on a build that cannot name its commit, or that came from a
  # tree with uncommitted changes. Local runs only warn.
  YKDM_VERIFY_RELEASE: "1"

jobs:
  # The gate runs again against the tag. It ran on the commit when it was pushed,
  # and a tag is a claim about a specific tree — cheap insurance against a tag
  # pointing somewhere nobody tested.
  gate:
    name: fmt, clippy, tests, coverage gate
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libudev-dev libpcsclite-dev

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage-core

      # Phase 8: the release notes carry the upgrade warning when the schema moved,
      # and this is also the check that the changelog has a section for the version
      # at all — the release stops here if it does not.
      - name: Release notes, with the schema upgrade note
        run: scripts/release-notes.sh "$TAG" | tee release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  macos:
    name: macOS bundle
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A Developer ID is what makes the camera grant survive a rebuild and what
      # gets the bundle past Gatekeeper (phase 3b). Until the certificate exists
      # the bundle is ad-hoc signed, which is honest: it works, and it warns.
      - name: Assemble the bundle
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -n "$SIGN_IDENTITY" ]; then
            packaging/macos/bundle.sh --release --dmg --sign "$SIGN_IDENTITY"
          else
            echo "::warning::no MACOS_SIGN_IDENTITY secret — the bundle is ad-hoc signed and Gatekeeper will block it (features/packaging-and-release.md phase 3b)"
            packaging/macos/bundle.sh --release --dmg
          fi

      - name: Verify the bundle
        run: packaging/macos/verify-bundle.sh

      # The .pkg wraps the bundle that was just verified, so the installer cannot
      # carry an app nothing checked. Its certificate is a *different* one from the
      # bundle's — Developer ID Installer, not Developer ID Application — which is
      # why this is a second secret rather than a reuse of the first.
      - name: Build the installer package
        env:
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
        run: |
          if [ -n "$INSTALLER_IDENTITY" ]; then
            packaging/macos/pkg.sh --sign-installer "$INSTALLER_IDENTITY"
          else
            echo "::warning::no MACOS_INSTALLER_SIGN_IDENTITY secret — the .pkg is unsigned, so Gatekeeper refuses it on first open and a management tool may refuse it outright (features/packaging-and-release.md phase 3c)"
            packaging/macos/pkg.sh
          fi

      - name: Verify the installer package
        run: packaging/macos/verify-pkg.sh

      # Both, deliberately: the .dmg is drag-to-install for an operator who
      # administers their own machine, and the .pkg is what a management tool can
      # push and what leaves a receipt naming the version. Neither does the other's
      # job — docs/operations.md says which to take.
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/bundle/*.dmg
            target/bundle/*.pkg

  linux:
    name: Linux packages
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libudev-dev libpcsclite-dev \
            desktop-file-utils

      - uses: Swatinem/rust-cache@v2

      - name: Build the tarball and the .deb
        run: packaging/linux/package.sh --release --deb

      # Both artefacts, because the .deb's control file is the half the tarball
      # does not have and the tarball is the half every distribution can use.
      - name: Verify the artefacts
        run: |
          for artefact in target/linux/*.tar.gz target/linux/*.deb; do
            packaging/linux/verify-package.sh "$artefact"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/linux/*.tar.gz
            target/linux/*.deb

  windows:
    name: Windows build
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: cargo build --release --features $env:YKDM_FEATURES

      # The zip is the portable artefact: it needs no administrator rights, which is
      # the case an operator who cannot install software on their own workstation is
      # in. It is built from its own staging directory, so nothing the MSI step
      # writes into target\windows can end up inside it.
      #
      # Both artefacts land in target\windows so that the two upload globs below
      # share an ancestor: `upload-artifact` roots an artefact at the least common
      # ancestor of everything it matched, so target\*.zip plus
      # target\windows\*.msi would have put the MSI in a subdirectory and the
      # release step's glob would have quietly missed it.
      - name: Package the portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path target\windows\portable | Out-Null
          Copy-Item target\release\yk-dist-manager.exe target\windows\portable\
          Copy-Item LICENSE, CHANGELOG.md target\windows\portable\
          Compress-Archive -Path target\windows\portable\* -DestinationPath "target\windows\yk-dist-manager-$version-x86_64-windows.zip" -Force

      # The same interrogation the other two platforms make: a binary that cannot
      # start says so here rather than at somebody's desk.
      - name: Ask the binary about itself
        shell: pwsh
        run: target\release\yk-dist-manager.exe --diagnose

      # Authenticode is phase 4 and is still blocked on a certificate, so the
      # installer ships unsigned and SmartScreen warns on first run. That used to be
      # the argument for shipping no installer at all; it is not, because the two
      # artefacts answer to different people — a zip cannot be pushed to a fleet,
      # cannot say in Programs and Features what version a machine has, and cannot
      # upgrade in place.
      - name: Build the installer
        shell: pwsh
        env:
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_CERT_THUMBPRINT }}
        run: |
          if ($env:SIGN_THUMBPRINT) {
            & .\packaging\windows\msi.ps1 -SignCertThumbprint $env:SIGN_THUMBPRINT
          } else {
            Write-Host "::warning::no WINDOWS_SIGN_CERT_THUMBPRINT secret — the .exe and the .msi are unsigned and SmartScreen will warn on first run (features/packaging-and-release.md phase 4)"
            & .\packaging\windows\msi.ps1
          }

      # This one really installs the package, interrogates what landed, and
      # uninstalls: an MSI's components, key paths and shortcut are authored, so they
      # can build cleanly and still be wrong on a machine. The runner is an
      # administrator with UAC off, which is what makes it possible here and not on
      # a developer's laptop.
      - name: Verify the installer
        shell: pwsh
        run: .\packaging\windows\verify-msi.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/windows/*.zip
            target/windows/*.msi

  draft:
    name: Draft the release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      # The release is named for the version, not for the ref. Left to default,
      # GitHub titles it with the tag — and since the namespace landed that reads
      # "releases/v0.16.0", which is a path where a version belongs. Bound to an
      # environment variable rather than interpolated into the script, the same
      # way `inputs.tag` is handled everywhere else in this file.
      - name: Name the release for its version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "RELEASE_NAME=${TAG##*/}" >>"$GITHUB_ENV"

      - name: Draft, never publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          draft: true
          body_path: artefacts/release-notes/release-notes.md
          files: |
            artefacts/macos/*
            artefacts/linux/*
            artefacts/windows/*
